name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r PaintedDesktop/requirements.txt -r requirements-test.txt pyinstaller

      - name: Run tests
        run: python -m pytest tests -v

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'PaintedDesktop'); from settings import APP_VERSION; print(APP_VERSION)")
          test "v$version" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} != APP_VERSION $version"; exit 1; }

      - name: Build app
        run: pyinstaller --noconfirm PaintedDesktop.spec

      - name: Build installer
        shell: pwsh  # Git Bash would rewrite the /D switch as a path
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = python -c "import sys; sys.path.insert(0, 'PaintedDesktop'); from settings import APP_VERSION; print(APP_VERSION)"
          iscc "/DMyAppVersion=$version" installer/setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PaintedDesktopSetup
          path: installer/dist/PaintedDesktopSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/PaintedDesktopSetup.exe
          generate_release_notes: true
